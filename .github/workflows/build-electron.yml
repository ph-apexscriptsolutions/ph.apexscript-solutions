name: Build & Publish Electron Desktop App

on:
  push:
    branches: [main]
    paths:
      - "electron-app/**"
      - ".github/workflows/build-electron.yml"

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: electron-app/package.json

      - name: Install dependencies
        working-directory: electron-app
        run: npm install

      - name: Build Windows installer and publish to GitHub Releases
        working-directory: electron-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:publish
